version: "3.9"

services:

  aurion-core:
    build: .
    container_name: aurion-core
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    restart: always

  redis:
    image: redis:7
    container_name: aurion-redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15
    container_name: aurion-db
    environment:
      POSTGRES_USER: aurion
      POSTGRES_PASSWORD: aurion_pass
      POSTGRES_DB: aurion_db
    ports:
      - "5432:5432"
    restart: always
